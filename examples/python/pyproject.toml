[project]
name = "nvim-python-devcontainer-example"
version = "0.1.0"
description = "A minimal uv-based Python project for developing with Neovim in a container"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pyrefly",
  "pytest",
  "pytest-cov>=7.1.0",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.pyrefly]
fallback-python-interpreter-name = "python"
project-includes = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
